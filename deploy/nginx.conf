# Nginx site config for Tokoshopee (research.md R-017; Constitution deployment
# constraints). TLS terminates here; PM2/Node never sees a raw HTTP connection
# from the internet, and never binds anywhere but 127.0.0.1 (ecosystem.config.js).
#
# PLACEHOLDER: replace `tokoshopee.com` with the real production domain
# everywhere it appears below, and the two `ssl_certificate*` paths with the
# ones Certbot creates for that domain — see docs/release-checklist.md.

# Plain HTTP exists only to redirect to HTTPS and to answer Let's Encrypt's
# HTTP-01 challenge; it never proxies to the app.
server {
    listen 80;
    listen [::]:80;
    server_name tokoshopee.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tokoshopee.com;

    ssl_certificate     /etc/letsencrypt/live/tokoshopee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tokoshopee.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Enforce HTTPS on every future visit, including subdomains, for a year.
    # Only ever serve this over a connection that is already HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;

    # Next.js's own hashed, immutable build assets — safe to cache forever.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Product image uploads (004, research R-301 and R-311). The app enforces
    # its own 2 MB limit and answers 413 with a JSON reason; 3m here leaves
    # room for the multipart framing so that answer comes from the app, not
    # from nginx. An exact match beats `location /`, so every other path keeps
    # the 1m above.
    location = /admin/api/uploads {
        client_max_body_size 3m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Next.js reads this to know the original request was HTTPS — without
        # it, absoluteUrl()/canonical/webhook-URL logic would see "http" for
        # every request, since Nginx's own connection to Node is plain HTTP.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
